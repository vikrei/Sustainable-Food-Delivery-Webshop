<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>FRAM Chat</title>
    <link rel="stylesheet" href="chatbot.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Frank+Ruhl+Libre:wght@300;400&display=swap"
        rel="stylesheet"
    >
</head>
<body>
    <header>
        <nav class="navbar">
            <button class="menu-button">
                ☰
            </button>
            <h1 class="logo">
                FRAM
            </h1>
            <button class="cart-button">
                0
            </button>
        </nav>
    </header>
         <div class="mobile-menu">
         <div class="mobile-menu-header">
            <button class="close-menu-button">
                ✕                </button>
            <h2 class="mobile-menu-logo">
                FRAM
            </h2>
            </div>
        <nav class="mobile-menu-links">
                <a href="index.html">HOME</a>
                <a href="products.html">PRODUCTS</a>
                <a href="chatbot.html">CHAT</a>
         </nav>
         <a class="checkout-link" href="#">
              CHECKOUT
          </a>
        </div>
    <main class="chat-page">
        <section class="chat-container">
            <div class="chat-messages">

                <div class="bot-message">
                    Welcome to FRAM support!
                    <br><br>
                    Type <strong>help</strong> to see all available commands.
                </div>
            </div>
            <div class="chat-input-section">
                <input
                    type="text"
                    class="chat-input"
                    placeholder="Ask something..."
                >
                <button class="send-button">
                    ↑
                </button>
            </div>
        </section>
    </main>
<script src="script.js"></script>
</body>
</html>
